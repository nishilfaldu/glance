<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Glance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
  :root { --bg: #ffffff; --fg: #171717; --muted: #666666; --line: #ebebeb; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #ededed; --muted: #a1a1a1; --line: #262626; color-scheme: dark } }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 8px; text-align: center;
    background: var(--bg); color: var(--fg); font: 15px/1.5 "Geist", system-ui, sans-serif;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  a { color: var(--fg); text-underline-offset: 3px; text-decoration-color: var(--muted); }
</style>
</head>
<body>
  <h1>Glance</h1>
  <p>Open a review link from a pull request.</p>
  <p><a href="/r/sample">See an example</a></p>
</body>
</html>
