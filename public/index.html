<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Glance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
  :root { --bg: #f6f7f9; --fg: #1d232b; --muted: #6b7480; --accent: #2b6cb0; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --fg: #e3e7ed; --muted: #97a0ad; --accent: #79b0ef; color-scheme: dark } }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 8px; text-align: center;
    background: var(--bg); color: var(--fg); font: 15px/1.5 "Instrument Sans", system-ui, sans-serif;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Glance</h1>
  <p>Open a review link from a pull request.</p>
  <p><a href="/r/sample">See an example</a></p>
</body>
